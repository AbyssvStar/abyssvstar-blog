spring:
  application:
    name: abyssvstar-blog

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:blog}
    username: ${POSTGRES_USER:blog}
    password: ${POSTGRES_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000
      max-lifetime: 1200000
      pool-name: blog-pool

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
      connect-timeout: 2s
      lettuce:
        pool:
          max-active: 8
          max-idle: 4
          min-idle: 1

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      # 主键交给数据库的 bigserial，不用雪花 ID
      id-type: auto
  # 目前只用注解式 mapper；留这个路径是为了将来复杂 SQL 可以放 XML
  mapper-locations: classpath*:mapper/**/*.xml

server:
  port: 8080
  shutdown: graceful
  compression:
    enabled: true
    mime-types: application/json,text/html,text/css,application/javascript
  error:
    whitelabel:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    redis:
      enabled: true

blog:
  admin:
    username: ${BLOG_ADMIN_USERNAME:admin}
    # 刻意不给默认值；为空时启动会记 WARN 并跳过建号
    password: ${BLOG_ADMIN_PASSWORD:}
  session:
    cookie-name: BLOG_SESSION
    ttl: 7d
    secure: ${BLOG_COOKIE_SECURE:true}
  rate-limit:
    # 可以关闭限流
    enabled: ${BLOG_RATE_LIMIT_ENABLED:true}
    key-prefix: blog:rl
    # IP 哈希盐。换掉后已有的限流计数会失效
    ip-salt: ${BLOG_IP_SALT:abyssvstar-blog}
  storage:
    endpoint: ${BLOG_STORAGE_ENDPOINT:http://localhost:9000}
    # 启动期强校验：未配置就让应用启动失败，不做降级
    access-key: ${BLOG_STORAGE_ACCESS_KEY:}
    secret-key: ${BLOG_STORAGE_SECRET_KEY:}
    bucket: ${BLOG_STORAGE_BUCKET:blog-media}
    # 图片对外前缀。生产环境应指向 Nginx：https://<域名>/media
    public-base-url: ${BLOG_STORAGE_PUBLIC_BASE_URL:http://localhost:9000/media}
    # 多环境共用一个 bucket 时用它隔离，例如 dev/
    key-prefix: ${BLOG_STORAGE_KEY_PREFIX:}

logging:
  level:
    root: INFO
    com.abyssvstar: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{traceId:-}] %logger{36} - %msg%n"
